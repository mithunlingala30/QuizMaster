<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Questions — QuizMaster</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="admin-dashboard.html" class="brand"><span class="brand-mark">Q</span> QuizMaster</a>
    <div class="sidebar-role">Admin Panel</div>
    <ul class="side-nav">
      <li><a href="admin-dashboard.html"><span class="ic">▤</span> Dashboard</a></li>
      <li><a href="manage-questions.html" class="active"><span class="ic">▦</span> Manage Questions</a></li>
      <li><a href="add-question.html"><span class="ic">✎</span> Add Question</a></li>
      <li><a href="students.html"><span class="ic">◐</span> Students</a></li>
      <li><a href="admin-results.html"><span class="ic">📈</span> Results</a></li>
    </ul>
    <div class="sidebar-foot">
      <a href="#" data-logout style="display:flex; align-items:center; gap:10px; padding:11px 14px; color:rgba(247,244,236,0.72); font-size:14.5px;"><span class="ic">⏻</span> Logout</a>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:14px;"><button class="menu-toggle">☰</button><h2>Manage Questions</h2></div>
      <div class="topbar-right"><a href="add-question.html" class="btn btn-gold btn-sm">+ Add Question</a></div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="panel-head">
          <h3>Question Bank</h3>
          <input type="text" id="searchBox" placeholder="Search questions…" style="padding:9px 14px; border:1.5px solid var(--border-dark); border-radius:999px; font-size:13.5px; width:220px;">
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Question</th><th>Category</th><th>Difficulty</th><th>Correct</th><th>Actions</th></tr></thead>
            <tbody id="qBody"><tr><td colspan="6"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/script.js"></script>
<script>
let allQuestions = [];

function render(list) {
  const body = document.getElementById("qBody");
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="em-icon">▦</div><h4>No questions found</h4><p>Try a different search, or add a new question.</p></div></td></tr>`;
    return;
  }
  body.innerHTML = list.map(q => `
    <tr>
      <td>${q.id}</td>
      <td style="max-width:340px;">${QM.escapeHtml(q.question)}</td>
      <td>${QM.escapeHtml(q.category)}</td>
      <td><span class="badge ${q.difficulty.toLowerCase()}">${q.difficulty}</span></td>
      <td>${q.correctAnswer}</td>
      <td class="row-actions">
        <a href="edit-question.html?id=${q.id}" class="btn btn-outline btn-sm">Edit</a>
        <button class="btn btn-danger btn-sm" data-del="${q.id}">Delete</button>
      </td>
    </tr>`).join("");

  body.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.del;
      QM.confirmModal({
        title: "Delete this question?",
        message: "Are you sure you want to delete this question? This cannot be undone.",
        confirmLabel: "Delete", danger: true,
        onConfirm: async () => {
          try {
            const res = await QM.apiGet("delete_question", { id });
            if (res.success) {
              QM.toast("Question deleted.", "success");
              allQuestions = allQuestions.filter(q => q.id != id);
              render(allQuestions);
            } else {
              QM.toast(res.message || "Could not delete question.", "error");
            }
          } catch (err) {
            QM.toast("Could not reach the server.", "error");
          }
        }
      });
    });
  });
}

if (QM.auth.requireAdmin()) {
  (async () => {
    try {
      allQuestions = await QM.apiGet("get_questions", { admin: 1 });
      render(allQuestions);
    } catch (err) {
      QM.toast("Could not load questions from the server.", "error");
    }
  })();

  document.getElementById("searchBox").addEventListener("input", (e) => {
    const term = e.target.value.toLowerCase();
    render(allQuestions.filter(q => q.question.toLowerCase().includes(term) || q.category.toLowerCase().includes(term)));
  });
}
</script>
</body>
</html>
