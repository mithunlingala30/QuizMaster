<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Question — QuizMaster</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="admin-dashboard.html" class="brand"><span class="brand-mark">Q</span> QuizMaster</a>
    <div class="sidebar-role">Admin Panel</div>
    <ul class="side-nav">
      <li><a href="admin-dashboard.html"><span class="ic">▤</span> Dashboard</a></li>
      <li><a href="manage-questions.html" class="active"><span class="ic">▦</span> Manage Questions</a></li>
      <li><a href="add-question.html"><span class="ic">✎</span> Add Question</a></li>
      <li><a href="students.html"><span class="ic">◐</span> Students</a></li>
      <li><a href="admin-results.html"><span class="ic">📈</span> Results</a></li>
    </ul>
    <div class="sidebar-foot">
      <a href="#" data-logout style="display:flex; align-items:center; gap:10px; padding:11px 14px; color:rgba(247,244,236,0.72); font-size:14.5px;"><span class="ic">⏻</span> Logout</a>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:14px;"><button class="menu-toggle">☰</button><h2>Edit Question</h2></div>
      <div class="topbar-right"><a href="manage-questions.html" class="btn btn-outline btn-sm">← Back to List</a></div>
    </header>

    <main class="content content-narrow">
      <div class="form-alert error" id="formAlert"></div>
      <div class="panel" id="formPanel" style="display:none;">
        <form id="editForm" novalidate>
          <input type="hidden" id="id" name="id">
          <div class="field" id="f-question"><label for="question">Question</label><textarea id="question" name="question" rows="3"></textarea></div>
          <div class="field-row">
            <div class="field" id="f-optionA"><label for="optionA">Option A</label><input type="text" id="optionA" name="optionA"></div>
            <div class="field" id="f-optionB"><label for="optionB">Option B</label><input type="text" id="optionB" name="optionB"></div>
          </div>
          <div class="field-row">
            <div class="field" id="f-optionC"><label for="optionC">Option C</label><input type="text" id="optionC" name="optionC"></div>
            <div class="field" id="f-optionD"><label for="optionD">Option D</label><input type="text" id="optionD" name="optionD"></div>
          </div>
          <div class="field-row">
            <div class="field" id="f-correctAnswer">
              <label for="correctAnswer">Correct Answer</label>
              <select id="correctAnswer" name="correctAnswer"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
            </div>
            <div class="field"><label for="marks">Marks</label><input type="number" id="marks" name="marks" min="1"></div>
          </div>
          <div class="field-row">
            <div class="field"><label for="category">Category</label><input type="text" id="category" name="category"></div>
            <div class="field">
              <label for="difficulty">Difficulty</label>
              <select id="difficulty" name="difficulty"><option value="Easy">Easy</option><option value="Medium">Medium</option><option value="Hard">Hard</option></select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">Save Changes</button>
        </form>
      </div>
      <div id="notFound" style="display:none;" class="empty-state"><h4>Question not found</h4><p>It may have already been deleted.</p></div>
    </main>
  </div>
</div>

<script src="js/script.js"></script>
<script>
if (QM.auth.requireAdmin()) {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const form = document.getElementById("editForm");
  const submitBtn = document.getElementById("submitBtn");
  const alertBox = document.getElementById("formAlert");

  (async () => {
    try {
      const questions = await QM.apiGet("get_questions", { admin: 1 });
      const q = questions.find(x => String(x.id) === String(id));
      if (!q) { document.getElementById("notFound").style.display = "block"; return; }

      form.id.value = q.id;
      form.question.value = q.question;
      form.optionA.value = q.optionA;
      form.optionB.value = q.optionB;
      form.optionC.value = q.optionC;
      form.optionD.value = q.optionD;
      form.correctAnswer.value = q.correctAnswer;
      form.category.value = q.category;
      form.difficulty.value = q.difficulty;
      form.marks.value = q.marks;
      document.getElementById("formPanel").style.display = "block";
    } catch (err) {
      QM.toast("Could not load question data.", "error");
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.remove("show");
    const data = {
      id: form.id.value, question: form.question.value.trim(), optionA: form.optionA.value.trim(),
      optionB: form.optionB.value.trim(), optionC: form.optionC.value.trim(), optionD: form.optionD.value.trim(),
      correctAnswer: form.correctAnswer.value, category: form.category.value.trim(),
      difficulty: form.difficulty.value, marks: form.marks.value
    };
    submitBtn.disabled = true; submitBtn.textContent = "Saving…";
    try {
      const res = await QM.api("edit_question", data);
      if (res.success) {
        QM.toast("Question updated.", "success");
        setTimeout(() => window.location.href = "manage-questions.html", 700);
      } else {
        alertBox.textContent = res.message || "Could not update question.";
        alertBox.classList.add("show");
      }
    } catch (err) {
      alertBox.textContent = "Could not reach the server.";
      alertBox.classList.add("show");
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = "Save Changes";
    }
  });
}
</script>
</body>
</html>
